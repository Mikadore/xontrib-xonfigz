name: Testing

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testing:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - uses: pre-commit/action@v3.0.0
    - name: Install dependencies
      run: uv sync
    - name: Run tests
      run: |
        uv run xonsh -c "xontrib load xontrib_prompster"
        uv run pytest
