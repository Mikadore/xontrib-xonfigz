
[project]
name = "xontrib-xonfigz"
version = "0.0.1"
license = {file = "LICENSE"}
description = "Library for declarative prompt building"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: Terminals",
]
requires-python = ">=3.14"
dependencies = ["xonsh>=0.24.2"]
authors = [
    { name = "Mikadore", email = "emil@mikadore.dev" },
]
[project.readme]
file = "README.md"
content-type = "text/markdown"



[project.entry-points."xonsh.xontribs"]
"xontrib_xonfigz" = "xontrib_xonfigz.main"



[project.urls]

Homepage = "https://github.com/Mikadore/xontrib-xonfigz"
Documentation = "https://github.com/Mikadore/xontrib-xonfigz/blob/master/README.md"
Code = "https://github.com/Mikadore/xontrib-xonfigz"
"Issue tracker" = "https://github.com/Mikadore/xontrib-xonfigz/issues"




[dependency-groups]
dev = ["pytest>=7.0"]

[tool.uv]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]

packages = ["xontrib_xonfigz"]



[tool.black]
include = '\.pyi?$'
force-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.vscode
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | disk-cache.sqlite3
)/
'''

[tool.ruff]
lint.select = [
    "E",
    "F",
    "B", # flake8-bugbear
    "I", # isort
    "UP", # pyupgrade
    "SIM", # simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff specific rules
]
